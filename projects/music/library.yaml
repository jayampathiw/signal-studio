# Track A (ADR-002) — the shared background-music library: one entry per
# track, and the licence record if a copyright claim ever lands. Audio lives
# in the local folder (MUSIC_LIBRARY_DIR, outside git) and on R2; publish
# changes with `ss music sync --dir <folder>`.
#
# moods: what a job asks for via manifest.audio.music.mood.
# platforms: 'all', or only the platforms the licence allows.
# enabled: false keeps a track in the record but out of rotation.

version: 1
tracks:
  # Sudden loss, accidents, heavy emotional stories (e.g. Fer-à-Cheval)
  - id: emotional-tragedy-piano-violin-01
    file: emotional-tragedy-piano-violin-01.mp3
    source: pixabay
    licence: pixabay-content-license
    platforms: all
    moods: [tragedy, shock]
    added: 2026-10-15
    notes: France Aujourd'hui set; licence checked by the owner before download
