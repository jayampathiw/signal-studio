<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4B483"/>
      <stop offset="100%" stop-color="#B8935A"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="500" cy="500" r="500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <rect width="1000" height="1000" fill="#1E3A5F"/>

    <!-- Folder back tab -->
    <path d="M 270 300 L 430 300 L 470 350 L 730 350 L 730 650 L 270 650 Z" fill="#16283D"/>

    <!-- Document inside folder, peeking above the front flap -->
    <rect x="335" y="270" width="330" height="230" rx="6" fill="#F4EFE6"/>

    <!-- Redacted lines on the exposed part -->
    <rect x="368" y="308" width="260" height="18" rx="3" fill="#2E4A66"/>
    <rect x="368" y="352" width="210" height="18" rx="3" fill="#2E4A66"/>

    <!-- Highlighted line -->
    <rect x="368" y="396" width="260" height="22" rx="3" fill="#E8B923"/>

    <rect x="368" y="444" width="190" height="18" rx="3" fill="#2E4A66"/>

    <!-- Folder front -->
    <path d="M 255 430 L 745 430 L 708 680 Q 705 698 687 698 L 313 698 Q 295 698 292 680 Z" fill="url(#folderGrad)"/>
  </g>
</svg>
