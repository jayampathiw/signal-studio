name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # scripts/golden's tests shell out to ffmpeg/ffprobe (P0.1) — not
      # guaranteed present on ubuntu-latest, install explicitly.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run grep-guard
      - run: pnpm run test
      - run: pnpm run examples

      # P1 T-L/T-G — coverage report for packages/core, kept as an artifact.
      - run: pnpm --filter @signal-studio/core run coverage
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: packages/core/coverage/lcov.info

      # P3 T-G — "ci.yml includes the ffmpeg golden suite". Downloads each
      # ffmpeg-rendered reference's real reference.mp4 from its golden.json's
      # public r2Url and re-checks it — a regression test for the golden
      # tooling + uploaded-reference integrity, not a re-render-from-source
      # (the real source assets for these aren't available to CI; see
      # scripts/golden/verify-references.mjs's own header). The Remotion
      # pair (case-file, clips-overlay) runs the same check in nightly.yml
      # instead, kept off every push since a real re-render pass for those
      # is the heavier future addition this is standing in for.
      - run: pnpm run golden:ffmpeg
